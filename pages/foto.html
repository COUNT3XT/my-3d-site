<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Главное фото</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        font-family: Arial, sans-serif;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        text-align: center;
        background: linear-gradient(125deg, #07050a, #150e2b, #2b1227, #07050a);
        background-size: 400% 400%;
        animation: neonGlow 15s ease infinite alternate;
      }
      @keyframes neonGlow {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
      h1 {
        color: #f80199;
        font-size: clamp(28px, 6vw, 64px);
        text-shadow: 0 0 24px rgba(248, 1, 153, 0.5);
      }
      p {
        color: #f80199;
        opacity: 0.7;
        font-size: 18px;
      }
      a {
        color: #f80199;
        font-weight: bold;
        font-size: 20px;
        text-decoration: none;
        padding: 14px 28px;
        border: 1px solid #f80199;
        border-radius: 5px;
        transition: background 0.2s ease;
      }
      a:hover {
        background: rgba(248, 1, 153, 0.15);
      }
      #cube-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        z-index: -1;
        pointer-events: none;
      }

      #cube-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="cube-container">
      <canvas id="cube-canvas"></canvas>
    </div>

    <h1>Скоро</h1>
    <p>Здесь будет содержимое этой страницы</p>
    <a href="../index.html">&larr; Назад</a>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      // Инициализация
      const container = document.getElementById("cube-container");
      const canvas = document.getElementById("cube-canvas");

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
        alpha: true,
      });

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x000000, 0);
      camera.position.z = 4;

      // Чёрный куб с блеском
      const geometry = new THREE.BoxGeometry(2, 2, 2);
      const material = new THREE.MeshStandardMaterial({
        color: 0x000000,
        metalness: 0.9,
        roughness: 0.2,
        emissive: 0x111111,
        envMapIntensity: 1.5,
      });

      const cube = new THREE.Mesh(geometry, material);
      scene.add(cube);

      // Освещение
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
      directionalLight.position.set(5, 5, 5);
      scene.add(directionalLight);

      const pointLight1 = new THREE.PointLight(0x4488ff, 0.8);
      pointLight1.position.set(-3, 3, 3);
      scene.add(pointLight1);

      const pointLight2 = new THREE.PointLight(0xff44ff, 0.6);
      pointLight2.position.set(3, -3, 3);
      scene.add(pointLight2);

      // Частицы
      const particlesGeometry = new THREE.BufferGeometry();
      const particleCount = 100;
      const posArray = new Float32Array(particleCount * 3);

      for (let i = 0; i < particleCount * 3; i += 3) {
        posArray[i] = (Math.random() - 0.5) * 10;
        posArray[i + 1] = (Math.random() - 0.5) * 10;
        posArray[i + 2] = (Math.random() - 0.5) * 10;
      }

      particlesGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(posArray, 3),
      );

      const particleMaterial = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.02,
        transparent: true,
        opacity: 0.3,
        sizeAttenuation: true,
      });

      const particles = new THREE.Points(particlesGeometry, particleMaterial);
      scene.add(particles);

      // Анимация
      let time = 0;

      function animate() {
        requestAnimationFrame(animate);
        time += 0.01;

        cube.rotation.x += 0.003;
        cube.rotation.y += 0.005;

        const positions = particlesGeometry.attributes.position.array;
        for (let i = 0; i < particleCount * 3; i += 3) {
          positions[i + 1] -= 0.002;

          if (positions[i + 1] < -5) {
            positions[i + 1] = 5;
          }
        }
        particlesGeometry.attributes.position.needsUpdate = true;

        ambientLight.intensity = 0.3 + Math.sin(time) * 0.1;
        pointLight1.intensity = 0.8 + Math.cos(time * 0.7) * 0.3;
        pointLight2.intensity = 0.6 + Math.sin(time * 0.5) * 0.2;

        renderer.render(scene, camera);
      }

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animate();
    </script>
  </body>
</html>
